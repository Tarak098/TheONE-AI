# ==============================================================================
# TheONE AI — Render Blueprint Deployment Specification
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: theone-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: TheONE AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      - key: GNANI_TTS_MODEL
        value: timbre-2.5
      - key: GNANI_TTS_LANGUAGE
        value: en-IN
      - key: GNANI_TTS_VOICE
        value: Zayan
      - key: GNANI_TTS_VOICE_FUNNY
        value: Yashvi
      - key: GNANI_TTS_VOICE_ROAST
        value: Zayan
      - key: GNANI_TTS_SAMPLE_RATE
        value: "48000"
      - key: GNANI_PRISMA_API_URL
        value: https://api.vachana.ai/stt/v3
      - key: GNANI_TIMBRE_API_URL
        value: https://api.vachana.ai/api/v1/tts/inference
      # Secrets to be entered manually in Render Dashboard:
      - key: GEMINI_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false

